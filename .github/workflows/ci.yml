name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: quote_engine
          POSTGRES_USER: quote_engine
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username quote_engine"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      QUOTE_ENGINE_TEST_DATABASE_URL: postgresql+psycopg://quote_engine:ci-only@localhost:5432/quote_engine_test
      # In CI the database tests must run: a missing database fails instead of skipping.
      QUOTE_ENGINE_REQUIRE_DATABASE: "1"
      # The same for the PDF render tests, which need Pango (installed below).
      QUOTE_ENGINE_REQUIRE_PDF: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: WeasyPrint's system libraries (as in infra/Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install dependencies
        run: uv sync --locked
      - name: OpenAPI schema is current
        run: uv run python -m quote_engine.export_openapi --check
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Engine purity (import-linter)
        run: uv run lint-imports
      - name: Tests with coverage (backend floor 80%)
        run: uv run pytest --cov
      - name: Engine coverage floor (95%)
        run: uv run coverage report --include="*/quote_engine/engine/*" --fail-under=95
      - name: Hook tests
        run: uv run pytest ../.claude/hooks -p no:cacheprovider

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  # Proves compose.yaml and infra/Dockerfile on a clean machine: the image builds, the
  # migrations run and the app answers its health check.
  stack:
    name: Local stack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Health endpoint answers
        run: curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes
