<!doctype html>
<html lang="{{ doc.lang }}">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
/* Noto Sans (SIL Open Font License 1.1, see assets/fonts/OFL.txt), bundled: the renderer
   loads nothing from the network. Two families: the Latin Extended file comes first, so letters such as
   č, ć, š, ž and đ are drawn whole (copied text stays right); the rest come from the Latin file. */
@font-face {
  font-family: "Noto Sans Latin";
  src: url("fonts/noto-sans-latin.woff2") format("woff2");
}
@font-face {
  font-family: "Noto Sans Latin Ext";
  src: url("fonts/noto-sans-latin-ext.woff2") format("woff2");
}

@page {
  size: A4;
  margin: 15mm 14mm 18mm;
  @bottom-left {
    content: {{ footer | css_string }};
    font: 7.5pt "Noto Sans Latin Ext", "Noto Sans Latin", sans-serif;
    color: {% if doc.sample %}#b42a17{% else %}#4b5258{% endif %};
  }
  @bottom-right {
    content: {{ t("page") | css_string }} " " counter(page) " " {{ t("of") | css_string }} " " counter(pages);
    font: 7.5pt "Noto Sans Latin Ext", "Noto Sans Latin", sans-serif;
    color: #4b5258;
  }
}

* { box-sizing: border-box; }
html {
  font-family: "Noto Sans Latin Ext", "Noto Sans Latin", sans-serif;
  font-size: 9pt;
  line-height: 1.35;
  color: #23272b;
}
body { margin: 0; }
p { margin: 0; }
h1 { font-size: 17pt; font-weight: 800; margin: 0 0 1mm; line-height: 1.15; }
h2 {
  font-size: 10.5pt;
  font-weight: 800;
  margin: 7mm 0 2mm;
  padding-bottom: 1mm;
  border-bottom: 0.4mm solid #23272b;
  break-after: avoid;
}
h3 { font-size: 9.5pt; font-weight: 800; margin: 0 0 1mm; break-after: avoid; }
.soft { color: #4b5258; }
.strong { font-weight: 700; }
.label {
  font-size: 7.5pt;
  font-weight: 700;
  color: #4b5258;
}
.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }

.sample {
  margin: 0 0 5mm;
  padding: 2mm 3mm;
  border: 0.4mm solid #b42a17;
  color: #b42a17;
  font-weight: 700;
}

.top { display: flex; justify-content: space-between; gap: 8mm; }
.top > div { flex: 1; }
.top .meta { text-align: right; }
.facts { border-collapse: collapse; margin-left: auto; }
.facts th { font-weight: 400; color: #4b5258; text-align: left; padding: 0.4mm 4mm 0.4mm 0; }
.facts td { font-weight: 700; text-align: right; padding: 0.4mm 0; }

table.lines { width: 100%; border-collapse: collapse; }
table.lines th {
  font-size: 7.5pt;
  font-weight: 700;
  color: #4b5258;
  text-align: left;
  padding: 1mm 2mm 1mm 0;
  border-bottom: 0.25mm solid #7a838a;
}
table.lines th.num { text-align: right; }
table.lines td {
  padding: 2mm 2mm 2mm 0;
  border-bottom: 0.25mm solid #d3d8d7;
  vertical-align: top;
}
/* A right-aligned number keeps a gap from the text column after it. */
table.lines .num { padding-left: 2mm; padding-right: 4mm; }
table.lines .num:last-child { padding-right: 0; }
table.lines.compact td { padding-top: 0.8mm; padding-bottom: 0.8mm; vertical-align: baseline; }
table.lines tr { break-inside: avoid; }
thead { display: table-header-group; }

svg.window { display: block; width: 100%; height: auto; }
{% block style %}{% endblock %}
</style>
</head>
<body>
{% if doc.sample %}
<p class="sample">{{ t("sample") }}</p>
{% endif %}
{% block body %}{% endblock %}
</body>
</html>
