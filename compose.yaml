# Local development stack: the app and its database.
#   docker compose up --build
# then open http://localhost:8000/api/v1/health
# The app does not talk to the database until milestone M6.
name: quote-engine

services:
  app:
    build:
      context: .
      dockerfile: infra/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: quote_engine
      POSTGRES_USER: quote_engine
      # Local development only. Deployments read secrets from a root-only env file (PLAN.md section 9).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/docker.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username quote_engine --dbname quote_engine"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  db-data:
